id: privacy_policy_ru
name: Политика конфиденциальности
doc_kind: service_doc
roles: []
rules:
  - id: operator_info
    title: Сведения об операторе
    question: >
      Указаны ли наименование (ФИО для ИП), адрес и ИНН оператора,
      обрабатывающего персональные данные?
    anchors: ["оператор", "наименование", "адрес", "ИНН"]
    risk_if_missing: high
    law_hints: ["ст. 18.1 152-ФЗ", "ст. 3 152-ФЗ"]
    rag_queries: ["оператор персональных данных обязанности сведения политика"]
  - id: purposes
    title: Цели обработки
    question: >
      Определены ли конкретные цели обработки персональных данных? Нет ли
      обработки, несовместимой с заявленными целями?
    anchors: ["цел", "обработк"]
    risk_if_missing: high
    law_hints: ["ст. 5 152-ФЗ", "ст. 18.1 152-ФЗ"]
    rag_queries: ["цели обработки персональных данных соответствие принципы"]
  - id: legal_basis
    title: Правовые основания обработки
    question: >
      Указаны ли правовые основания обработки (согласие субъекта, договор,
      закон)? Соответствуют ли основания заявленным целям?
    anchors: ["основани", "согласи", "закон", "договор"]
    risk_if_missing: high
    law_hints: ["ст. 6 152-ФЗ"]
    rag_queries: ["правовые основания обработки персональных данных согласие"]
  - id: categories
    title: Категории субъектов и состав ПДн
    question: >
      Перечислены ли категории субъектов и состав обрабатываемых персональных
      данных? Нет ли избыточных данных, не отвечающих целям?
    anchors: ["категори", "состав", "перечень"]
    risk_if_missing: medium
    law_hints: ["ст. 5 152-ФЗ"]
    rag_queries: ["состав персональных данных избыточность соразмерность целям"]
  - id: special_categories
    title: Специальные категории и биометрия
    question: >
      Если обрабатываются специальные категории (здоровье и т.п.) или
      биометрия — есть ли для этого предусмотренные законом основания?
    anchors: ["специальн", "биометр", "здоров"]
    risk_if_missing: medium
    law_hints: ["ст. 10 152-ФЗ", "ст. 11 152-ФЗ"]
    rag_queries: ["специальные категории персональных данных биометрия основания"]
  - id: processing_order
    title: Порядок и условия обработки, сроки хранения
    question: >
      Описаны ли способы обработки и сроки хранения ПДн? Определён ли момент
      прекращения обработки (достижение цели, отзыв согласия)?
    anchors: ["срок хранен", "способ", "прекращен", "уничтожен"]
    risk_if_missing: medium
    law_hints: ["ст. 5 152-ФЗ", "ст. 21 152-ФЗ"]
    rag_queries: ["сроки хранения персональных данных уничтожение прекращение обработки"]
  - id: cross_border
    title: Трансграничная передача
    question: >
      Если ПДн передаются в другие страны — указаны ли эти страны и соблюдены
      ли условия трансграничной передачи?
    anchors: ["трансгранич", "передач", "стран"]
    risk_if_missing: low
    law_hints: ["ст. 12 152-ФЗ"]
    rag_queries: ["трансграничная передача персональных данных условия уведомление"]
  - id: third_parties
    title: Передача третьим лицам и поручение обработки
    question: >
      Раскрыто ли, кому и на каком основании передаются ПДн? Если обработка
      поручена третьему лицу — есть ли требуемые условия поручения?
    anchors: ["третьим лиц", "поручен", "передач"]
    risk_if_missing: medium
    law_hints: ["ст. 6 152-ФЗ"]
    rag_queries: ["поручение обработки персональных данных третьи лица условия"]
  - id: subject_rights
    title: Права субъекта и порядок их реализации
    question: >
      Разъяснены ли права субъекта (доступ, уточнение, блокирование,
      удаление, отзыв согласия) и порядок обращения к оператору?
    anchors: ["прав субъект", "отзыв", "доступ", "уточнен", "удален"]
    risk_if_missing: high
    law_hints: ["ст. 14 152-ФЗ", "ст. 18.1 152-ФЗ"]
    rag_queries: ["права субъекта персональных данных доступ отзыв согласия"]
  - id: security
    title: Меры безопасности
    question: >
      Описаны ли принимаемые меры по защите ПДн (правовые, организационные,
      технические)?
    anchors: ["безопасн", "защит", "меры"]
    risk_if_missing: medium
    law_hints: ["ст. 18.1 152-ФЗ", "ст. 19 152-ФЗ"]
    rag_queries: ["меры обеспечения безопасности персональных данных оператор"]
  - id: cookies
    title: Cookies и аналитика
    question: >
      Если используются cookies/метрики/аналитика — раскрыто ли это и указан
      ли способ отказа?
    anchors: ["cookie", "куки", "метрик", "аналитик"]
    risk_if_missing: low
    law_hints: ["ст. 6 152-ФЗ", "ст. 9 149-ФЗ"]
    rag_queries: ["обработка данных пользователей cookie аналитика согласие"]
  - id: publication
    title: Актуальность и доступность
    question: >
      Указана ли дата/редакция политики и обеспечен ли к ней свободный доступ
      (опубликована на сайте/в приложении)?
    anchors: ["редакц", "дата", "опубликов", "доступ"]
    risk_if_missing: low
    law_hints: ["ст. 18.1 152-ФЗ"]
    rag_queries: ["опубликование политики обработки персональных данных доступ"]
