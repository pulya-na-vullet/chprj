id: user_agreement_ru
name: Пользовательское соглашение
doc_kind: service_doc
roles: []
rules:
  - id: subject
    title: Предмет соглашения
    question: >
      Определён ли предмет: что за сервис, какие функции предоставляются и на
      каких условиях? Понятно ли, кто оператор сервиса?
    anchors: ["предмет", "сервис", "услуг"]
    risk_if_missing: high
    law_hints: ["ст. 432 ГК РФ", "ст. 435 ГК РФ"]
    rag_queries: ["существенные условия договора предмет оферта"]
  - id: acceptance
    title: Порядок акцепта (присоединение)
    question: >
      Описан ли порядок заключения: как пользователь принимает условия
      (регистрация, начало использования), с какого момента соглашение
      считается заключённым?
    anchors: ["акцепт", "принима", "присоедин", "регистрац"]
    risk_if_missing: high
    law_hints: ["ст. 437 ГК РФ", "ст. 438 ГК РФ"]
    rag_queries: ["публичная оферта акцепт заключение договора конклюдентные действия"]
  - id: parties_obligations
    title: Права и обязанности сторон
    question: >
      Сбалансированы ли права и обязанности пользователя и сервиса? Нет ли
      обязанностей пользователя без встречных обязательств сервиса?
    anchors: ["прав", "обязан"]
    risk_if_missing: medium
    law_hints: ["ст. 10 ЗоЗПП"]
    rag_queries: ["права обязанности сторон договора оказания услуг"]
  - id: ip_license
    title: Интеллектуальная собственность и контент
    question: >
      Урегулированы ли права на контент сервиса и на контент пользователя?
      Есть ли лицензия на пользовательский контент и не является ли она
      чрезмерно широкой (бессрочная безвозмездная передача исключительных прав)?
    anchors: ["интеллектуальн", "контент", "лицензи", "исключительн"]
    risk_if_missing: medium
    law_hints: ["ст. 1235 ГК РФ", "ст. 1286 ГК РФ"]
    rag_queries: ["лицензионный договор объём прав пользовательский контент"]
  - id: liability_limit
    title: Ограничение ответственности
    question: >
      Не ущемляет ли ограничение ответственности права потребителя? Условия,
      полностью снимающие ответственность сервиса перед потребителем, ничтожны.
    anchors: ["ответственн", "не несёт", "не отвечает"]
    risk_if_missing: high
    law_hints: ["ст. 16 ЗоЗПП", "ст. 400 ГК РФ"]
    rag_queries: ["ограничение ответственности потребитель ничтожность условия"]
  - id: price_and_payment
    title: Стоимость и оплата (если сервис платный)
    question: >
      Если сервис платный — определены ли стоимость, порядок оплаты, условия
      возврата? Прозрачны ли автопродление и списания?
    anchors: ["стоимост", "оплат", "тариф", "возврат", "подписк"]
    risk_if_missing: medium
    law_hints: ["ст. 10 ЗоЗПП", "ст. 32 ЗоЗПП"]
    rag_queries: ["информация о цене услуги право на отказ возврат потребитель"]
  - id: unilateral_change
    title: Изменение условий
    question: >
      Как сервис меняет условия? Есть ли уведомление пользователя и разумный
      срок? Одностороннее молчаливое изменение в ущерб потребителю оспоримо.
    anchors: ["изменен", "в одностороннем", "актуальн редакц"]
    risk_if_missing: medium
    law_hints: ["ст. 310 ГК РФ", "ст. 450 ГК РФ"]
    rag_queries: ["одностороннее изменение условий договора уведомление"]
  - id: termination
    title: Прекращение доступа и блокировка
    question: >
      Определены ли основания и порядок блокировки/прекращения доступа?
      Не является ли право сервиса блокировать произвольным и безусловным?
    anchors: ["блокир", "прекращ", "расторж", "приостанов"]
    risk_if_missing: medium
    law_hints: ["ст. 782 ГК РФ"]
    rag_queries: ["односторонний отказ от договора оказания услуг основания"]
  - id: disputes
    title: Применимое право и разрешение споров
    question: >
      Указаны ли применимое право и порядок споров? Не навязана ли
      подсудность, ущемляющая право потребителя на выбор суда?
    anchors: ["спор", "подсудн", "применим прав", "суд"]
    risk_if_missing: medium
    law_hints: ["ст. 17 ЗоЗПП", "ст. 29 ГПК РФ"]
    rag_queries: ["подсудность иски о защите прав потребителей выбор суда"]
  - id: requisites
    title: Реквизиты и контакты оператора
    question: >
      Указаны ли наименование/ИНН/ОГРН и контактные данные оператора сервиса,
      куда пользователь может обратиться?
    anchors: ["реквизит", "ИНН", "ОГРН", "контакт", "адрес"]
    risk_if_missing: low
    law_hints: ["ст. 10 ЗоЗПП"]
    rag_queries: ["информация об изготовителе исполнителе наименование адрес"]
