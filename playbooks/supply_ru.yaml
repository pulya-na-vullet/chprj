id: supply_ru
name: Договор поставки
roles: ["Покупатель", "Поставщик"]
rules:
  - id: subject_goods
    title: Наименование и количество товара
    question: >
      Согласованы ли наименование и количество товара так, чтобы предмет
      считался определённым? Нет ли отсылки к спецификации, которая не
      приложена или заполняется одной стороной в одностороннем порядке?
    anchors: ["наименовани", "количеств", "товар", "спецификаци"]
    risk_if_missing: high
    law_hints: ["ст. 455 ГК РФ", "ст. 465 ГК РФ", "ст. 506 ГК РФ"]
    rag_queries: ["существенные условия договора поставки наименование количество товара"]
  - id: delivery_terms
    title: Сроки и периоды поставки
    question: >
      Определены ли срок или периоды поставки? Привязаны ли они к событиям,
      которые могут не наступить (получение аванса, готовность склада), и не
      даёт ли это поставщику неограниченно откладывать отгрузку?
    anchors: ["срок поставк", "период поставк", "отгрузк"]
    risk_if_missing: high
    law_hints: ["ст. 508 ГК РФ", "ст. 314 ГК РФ"]
    rag_queries: ["сроки и периоды поставки товара договор"]
  - id: price_payment
    title: Цена и порядок оплаты
    question: >
      Определены ли цена, валюта и порядок расчётов? Нет ли условий об
      авансе без встречного обеспечения, права поставщика в одностороннем
      порядке менять цену или ставить оплату в зависимость от третьих лиц?
    anchors: ["цена", "оплат", "расчет", "аванс", "предоплат"]
    risk_if_missing: high
    law_hints: ["ст. 516 ГК РФ", "ст. 486 ГК РФ"]
    rag_queries: ["цена и порядок оплаты по договору поставки"]
  - id: quality_warranty
    title: Качество и гарантия
    question: >
      Установлены ли требования к качеству и гарантийный срок? Нет ли
      формулировок, сужающих законную ответственность продавца за недостатки
      или перекладывающих бремя доказывания дефекта на покупателя?
    anchors: ["качеств", "гаранти", "недостатк", "дефект"]
    risk_if_missing: medium
    law_hints: ["ст. 469 ГК РФ", "ст. 470 ГК РФ", "ст. 476 ГК РФ"]
    rag_queries: ["качество товара гарантийный срок договор поставки"]
  - id: completeness
    title: Комплектность и тара
    question: >
      Согласованы ли комплектность товара, требования к таре и упаковке?
      Нет ли условия, освобождающего поставщика от ответственности за
      повреждения из-за ненадлежащей упаковки?
    anchors: ["комплектност", "комплект", "тар", "упаковк"]
    risk_if_missing: medium
    law_hints: ["ст. 478 ГК РФ", "ст. 481 ГК РФ"]
    rag_queries: ["комплектность товара тара упаковка договор поставки"]
  - id: acceptance
    title: Приёмка по количеству и качеству
    question: >
      Установлен ли порядок приёмки по количеству и качеству, сроки осмотра
      и уведомления о недостатках? Нет ли сжатых сроков претензий, после
      которых покупатель лишается права ссылаться на дефекты (ст. 483 ГК)?
    anchors: ["приемк", "осмотр", "уведомлен", "явн"]
    risk_if_missing: high
    law_hints: ["ст. 513 ГК РФ", "ст. 483 ГК РФ", "ст. 474 ГК РФ"]
    rag_queries: ["приемка товара по количеству и качеству сроки уведомления о недостатках"]
  - id: title_risk_transfer
    title: Переход права собственности и риска
    question: >
      Совпадают ли моменты перехода права собственности и риска случайной
      гибели, и связаны ли они с фактической передачей? Нет ли разрыва, при
      котором риск переходит к покупателю раньше получения товара?
    anchors: ["право собственност", "риск", "гибел", "передач"]
    risk_if_missing: medium
    law_hints: ["ст. 459 ГК РФ", "ст. 491 ГК РФ", "ст. 458 ГК РФ"]
    rag_queries: ["момент перехода права собственности и риска гибели товара"]
  - id: penalty
    title: Неустойка за просрочку
    question: >
      Сбалансирована ли неустойка для обеих сторон? Нет ли одностороннего
      штрафа (только за просрочку оплаты) или несоразмерно высокой пени,
      которую суд снизит по ст. 333 ГК?
    anchors: ["неустойк", "пени", "штраф", "просрочк"]
    risk_if_missing: medium
    law_hints: ["ст. 330 ГК РФ", "ст. 521 ГК РФ", "ст. 333 ГК РФ"]
    rag_queries: ["неустойка за просрочку поставки и оплаты договор"]
  - id: unilateral_refusal
    title: Односторонний отказ от договора
    question: >
      Как урегулирован односторонний отказ? Соответствуют ли основания
      существенным нарушениям (ст. 523 ГК) или одна сторона получает право
      выйти из договора произвольно и без компенсации другой?
    anchors: ["односторонн", "отказ", "расторж"]
    risk_if_missing: medium
    law_hints: ["ст. 523 ГК РФ", "ст. 450.1 ГК РФ"]
    rag_queries: ["односторонний отказ от исполнения договора поставки существенное нарушение"]
  - id: undersupply
    title: Недопоставка и восполнение
    question: >
      Урегулированы ли последствия недопоставки: обязанность восполнить,
      право покупателя на закупку у третьих лиц за счёт поставщика? Нет ли
      условия, освобождающего поставщика от восполнения недопоставленного?
    anchors: ["недопоставк", "восполн", "ассортимент", "количеств"]
    risk_if_missing: medium
    law_hints: ["ст. 511 ГК РФ", "ст. 520 ГК РФ"]
    rag_queries: ["недопоставка товара восполнение договор поставки"]
  - id: force_majeure
    title: Форс-мажор
    question: >
      Не расширен ли перечень обстоятельств непреодолимой силы до обычных
      предпринимательских рисков (колебания курса, действия контрагентов,
      отсутствие товара у поставщика)? Установлен ли срок уведомления?
    anchors: ["непреодолим", "форс-мажор", "обстоятельств"]
    risk_if_missing: low
    law_hints: ["ст. 401 ГК РФ"]
    rag_queries: ["обстоятельства непреодолимой силы предпринимательский риск поставка"]
  - id: disputes
    title: Претензии и подсудность
    question: >
      Установлен ли претензионный порядок и срок ответа на претензию?
      Не создаёт ли выбранная подсудность неудобный форум для одной из
      сторон? Для арбитражных споров претензионный порядок обязателен.
    anchors: ["претензи", "подсудност", "арбитраж", "спор"]
    risk_if_missing: low
    law_hints: ["ст. 4 АПК РФ"]
    rag_queries: ["претензионный порядок подсудность спор по договору поставки"]
