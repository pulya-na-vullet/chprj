id: pdn_consent_ru
name: Согласие на обработку ПДн
doc_kind: service_doc
roles: []
rules:
  - id: subject_identity
    title: Идентификация субъекта
    question: >
      Указаны ли ФИО, адрес и реквизиты документа, удостоверяющего личность
      субъекта (или его представителя)?
    anchors: ["ФИО", "фамилия", "паспорт", "адрес", "представител"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["содержание согласия на обработку персональных данных сведения о субъекте"]
  - id: operator
    title: Наименование и адрес оператора
    question: >
      Указаны ли наименование (ФИО) и адрес оператора, получающего согласие?
    anchors: ["оператор", "наименование", "адрес"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["согласие оператор наименование адрес персональные данные"]
  - id: purpose
    title: Цель обработки
    question: >
      Определена ли конкретная цель обработки, на которую даётся согласие?
    anchors: ["цел"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["цель обработки персональных данных в согласии субъекта"]
  - id: data_list
    title: Перечень персональных данных
    question: >
      Приведён ли конкретный перечень ПДн, на обработку которых даётся
      согласие? Не сформулирован ли перечень как «любые данные»?
    anchors: ["перечень", "состав", "данны"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["перечень персональных данных согласие конкретность"]
  - id: actions_methods
    title: Перечень действий и способы обработки
    question: >
      Перечислены ли действия с ПДн (сбор, хранение, передача и т.п.) и общее
      описание способов обработки (с использованием средств автоматизации или без)?
    anchors: ["действи", "сбор", "хранени", "передач", "автоматизац"]
    risk_if_missing: medium
    law_hints: ["ст. 9 152-ФЗ", "ст. 3 152-ФЗ"]
    rag_queries: ["перечень действий с персональными данными способы обработки"]
  - id: processor
    title: Обработка по поручению
    question: >
      Если обработка поручается третьему лицу — указаны ли его наименование
      и адрес в согласии?
    anchors: ["поручен", "третьему лиц"]
    risk_if_missing: low
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["обработка по поручению согласие наименование лица"]
  - id: term
    title: Срок действия согласия
    question: >
      Указан ли срок, в течение которого действует согласие?
    anchors: ["срок", "действ"]
    risk_if_missing: medium
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["срок действия согласия на обработку персональных данных"]
  - id: withdrawal
    title: Порядок отзыва согласия
    question: >
      Описан ли порядок отзыва согласия (способ подачи, последствия)?
    anchors: ["отзыв", "отозв"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ", "ст. 21 152-ФЗ"]
    rag_queries: ["отзыв согласия на обработку персональных данных порядок последствия"]
  - id: voluntary_specific
    title: Конкретность, информированность, добровольность
    question: >
      Является ли согласие конкретным, информированным и сознательным? Нет ли
      «согласия по умолчанию», преформленных галочек, обусловленности услуги?
    anchors: ["добровольн", "конкретн", "по умолчанию", "галочк"]
    risk_if_missing: high
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["согласие конкретное информированное добровольное недопустимость обусловленности"]
  - id: signature
    title: Подпись / подтверждение
    question: >
      Предусмотрен ли способ подтверждения согласия (подпись, в т.ч.
      электронная, или иное подтверждение), позволяющий установить факт его дачи?
    anchors: ["подпис", "подтвержд", "электронн"]
    risk_if_missing: medium
    law_hints: ["ст. 9 152-ФЗ"]
    rag_queries: ["форма согласия подпись электронная подтверждение персональные данные"]
