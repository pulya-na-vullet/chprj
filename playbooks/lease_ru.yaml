id: lease_ru
name: Договор аренды
roles: ["Арендатор", "Арендодатель"]
rules:
  - id: leased_object
    title: Объект аренды и его идентификация
    question: >
      Позволяют ли данные договора однозначно определить передаваемое
      имущество (адрес, площадь, кадастровый/инвентарный номер)? Без
      идентификации объекта договор считается незаключённым.
    anchors: ["объект", "имуществ", "помещени", "площад", "кадастров"]
    risk_if_missing: high
    law_hints: ["ст. 607 ГК РФ", "ст. 432 ГК РФ"]
    rag_queries: ["идентификация объекта аренды существенное условие незаключённость"]
  - id: term_registration
    title: Срок аренды и госрегистрация
    question: >
      Определён ли срок аренды и учтено ли требование о госрегистрации
      договора недвижимости на срок год и более? Нет ли риска, что без
      регистрации договор не создаёт последствий для третьих лиц?
    anchors: ["срок аренд", "регистраци", "год"]
    risk_if_missing: high
    law_hints: ["ст. 609 ГК РФ", "ст. 651 ГК РФ", "ст. 610 ГК РФ"]
    rag_queries: ["срок аренды государственная регистрация договора недвижимости год"]
  - id: rent_change
    title: Арендная плата и порядок её изменения
    question: >
      Определены ли размер и порядок внесения арендной платы? Не позволяет ли
      договор арендодателю менять плату чаще одного раза в год или в
      одностороннем порядке без ограничивающей формулы?
    anchors: ["арендн", "плат", "изменени", "индексаци"]
    risk_if_missing: high
    law_hints: ["ст. 614 ГК РФ", "ст. 424 ГК РФ"]
    rag_queries: ["арендная плата порядок и периодичность изменения не чаще раза в год"]
  - id: security_deposit
    title: Обеспечительный платёж
    question: >
      Урегулированы ли назначение обеспечительного платежа, основания его
      удержания и возврата? Нет ли права арендодателя удерживать его
      произвольно или засчитывать за пределами реального ущерба?
    anchors: ["обеспечительн", "депозит", "гарантийн", "удержан"]
    risk_if_missing: medium
    law_hints: ["ст. 381.1 ГК РФ", "ст. 329 ГК РФ"]
    rag_queries: ["обеспечительный платёж аренда основания удержания и возврата"]
  - id: handover_return
    title: Передача и возврат по акту
    question: >
      Предусмотрены ли передача и возврат объекта по акту с фиксацией
      состояния? Нет ли условия, позволяющего арендодателю относить любой
      износ на арендатора при возврате?
    anchors: ["передач", "возврат", "акт", "состояни", "износ"]
    risk_if_missing: medium
    law_hints: ["ст. 611 ГК РФ", "ст. 622 ГК РФ"]
    rag_queries: ["передача и возврат объекта аренды по акту приёма-передачи"]
  - id: repairs
    title: Текущий и капитальный ремонт
    question: >
      Как распределены обязанности по текущему и капитальному ремонту?
      Нет ли перекладывания капитального ремонта на арендатора без снижения
      платы, вопреки диспозитивной норме ст. 616 ГК?
    anchors: ["ремонт", "капитальн", "текущ", "содержани"]
    risk_if_missing: medium
    law_hints: ["ст. 616 ГК РФ"]
    rag_queries: ["распределение обязанностей текущий и капитальный ремонт аренда"]
  - id: improvements
    title: Улучшения арендованного имущества
    question: >
      Урегулирована ли судьба отделимых и неотделимых улучшений и компенсация
      их стоимости? Нет ли условия, лишающего арендатора возмещения за
      согласованные неотделимые улучшения?
    anchors: ["улучшени", "неотделим", "отделим", "возмещени"]
    risk_if_missing: low
    law_hints: ["ст. 623 ГК РФ"]
    rag_queries: ["отделимые и неотделимые улучшения арендованного имущества компенсация"]
  - id: sublease
    title: Субаренда и передача прав
    question: >
      Определены ли условия субаренды и передачи прав по договору? Нет ли
      полного запрета без компенсации либо, напротив, права свободно сдавать
      объект в субаренду в ущерб интересам арендодателя?
    anchors: ["субаренд", "поднаем", "передача прав", "перенаем"]
    risk_if_missing: low
    law_hints: ["ст. 615 ГК РФ"]
    rag_queries: ["субаренда согласие арендодателя условия договор аренды"]
  - id: early_termination
    title: Досрочное расторжение
    question: >
      Сбалансированы ли основания досрочного расторжения для арендодателя и
      арендатора? Нет ли у одной стороны права на немотивированный выход или
      расширенного перечня оснований сверх ст. 619–620 ГК?
    anchors: ["досрочн", "расторж", "отказ", "прекращени"]
    risk_if_missing: medium
    law_hints: ["ст. 619 ГК РФ", "ст. 620 ГК РФ", "ст. 450 ГК РФ"]
    rag_queries: ["основания досрочного расторжения договора аренды по требованию сторон"]
  - id: preemptive_right
    title: Преимущественное право на новый срок
    question: >
      Сохранено ли за арендатором преимущественное право на заключение
      договора на новый срок? Нет ли условия, необоснованно лишающего его
      этого права или ставящего его в зависимость от воли арендодателя?
    anchors: ["преимуществен", "новый срок", "продлени", "возобновлени"]
    risk_if_missing: low
    law_hints: ["ст. 621 ГК РФ"]
    rag_queries: ["преимущественное право арендатора на заключение договора на новый срок"]
  - id: liability_utilities
    title: Ответственность и коммунальные платежи
    question: >
      Сбалансирована ли ответственность сторон и чётко ли распределены
      коммунальные и эксплуатационные платежи? Нет ли одностороннего штрафа
      или возложения на арендатора расходов, которые несёт собственник?
    anchors: ["ответственност", "неустойк", "коммунальн", "эксплуатацион", "платеж"]
    risk_if_missing: medium
    law_hints: ["ст. 330 ГК РФ", "ст. 616 ГК РФ", "ст. 401 ГК РФ"]
    rag_queries: ["коммунальные платежи и ответственность сторон договор аренды"]
  - id: disputes
    title: Претензии и подсудность
    question: >
      Установлен ли претензионный порядок и срок ответа на претензию?
      Не создаёт ли выбранная подсудность неудобный форум для одной из
      сторон? Для арбитражных споров претензионный порядок обязателен.
    anchors: ["претензи", "подсудност", "арбитраж", "спор"]
    risk_if_missing: low
    law_hints: ["ст. 4 АПК РФ"]
    rag_queries: ["претензионный порядок подсудность спор по договору аренды"]
