[project]
name = "neurolegal"
version = "0.1.0"
description = "Russian-law classic RAG backend"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.13",
    "prometheus-client>=0.21",
    "python-json-logger>=2.0",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "sse-starlette>=3.4.4",
    "python-multipart>=0.0.9",
    "trafilatura>=2.1.0",
    "liteparse>=2.4.0",
    "aioboto3>=13.0",
    "argon2-cffi>=23.1",
    "aiosmtplib>=3.0",
    "email-validator>=2.2",
    "docxtpl>=0.20.2",
]

[project.scripts]
neurolegal = "neurolegal.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=2.0",
    "ruff>=0.7",
    "types-PyYAML>=6.0",
    "types-aioboto3[s3]>=13.0",
    "aiosqlite>=0.22.1",
    "honcho>=2.0.0",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolegal"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]  # длина строки + кириллические литералы повсеместны

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false  # FastAPI, typer декораторы
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "docxtpl.*",
    "pgvector.*",
    "prometheus_client.*",
    "tenacity.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: requires DATABASE_URL and OPENROUTER_API_KEY (real network/DB)",
    "db_only: requires DATABASE_URL (no external network)",
    "api_with_mocks: hits FastAPI app with mocked deps (no DB, no network)",
    "external_openrouter: requires OPENROUTER_API_KEY (real network)",
]
